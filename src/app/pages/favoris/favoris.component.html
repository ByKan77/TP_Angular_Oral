<h1>Mes favoris</h1>
<p class="hint">Les favoris sont enregistrés dans le navigateur (localStorage).</p>

@if (favorisService.favoris().length === 0) {
  <p class="empty">Aucun favori pour le moment. Ajoutez des ⭐ depuis la liste des personnages.</p>
} @else {
  <div class="grid">
    @for (c of favorisService.favoris(); track c.id) {
      <app-character-card
        [character]="c"
        (toggleFavori)="onToggle($event)"
      />
    }
  </div>
}
